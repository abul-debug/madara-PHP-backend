<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=720, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>MADARA 5.1 - AI Prediction Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #f3eef8;
            --bg-card: #faf7fc;
            --bg-soft: #f0e9f7;
            --purple-dark: #4a2c6a;
            --purple-mid: #7b5ea7;
            --purple-light: #c9b8e0;
            --purple-accent: #9b7bb8;
            --text-main: #2d1b3d;
            --text-soft: #5c4a6e;
            --success: #2e7d32;
            --danger: #c62828;
            --pending: #f9a825;
            --border: #d4c4e8;
            --shadow: rgba(74, 44, 106, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'El Messiri', sans-serif;
            background: linear-gradient(160deg, #f8f4fc 0%, #e8dff5 40%, #d4c4e8 100%);
            min-height: 100vh;
            color: var(--text-main);
            padding-bottom: 40px;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 18px 12px 8px;
            background: linear-gradient(180deg, #e8dff5 0%, transparent 100%);
        }

        .header svg {
            width: 100%;
            max-width: 520px;
            height: auto;
        }

        .header text {
            font-family: 'El Messiri', sans-serif;
            font-weight: 700;
            font-size: 72px;
            fill: url(#purpleGrad);
            filter: drop-shadow(2px 3px 4px rgba(74,44,106,0.25));
        }

        .subtitle {
            font-size: 14px;
            color: var(--purple-mid);
            letter-spacing: 3px;
            margin-top: -6px;
            font-weight: 500;
        }

        /* Main container */
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 12px 16px;
        }

        /* Card base */
        .card {
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 18px var(--shadow);
            margin-bottom: 18px;
            overflow: hidden;
        }

        /* Current Period + Result */
        .current-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            background: linear-gradient(135deg, #f0e9f7, #e8dff5);
        }

        .current-item {
            padding: 18px 16px;
            position: relative;
        }

        .current-item:first-child {
            border-right: 1px solid var(--border);
        }

        .current-item .label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--purple-mid);
            margin-bottom: 8px;
        }

        .current-item .label i {
            color: var(--purple-accent);
            animation: pulse 1.8s infinite;
        }

        .current-item .value {
            font-size: 20px;
            font-weight: 700;
            color: var(--purple-dark);
            background: rgba(255,255,255,0.55);
            padding: 10px 8px;
            border-radius: 10px;
            text-align: center;
            letter-spacing: 0.5px;
            word-break: break-all;
            line-height: 1.25;
        }

        .current-item.right .label {
            justify-content: flex-end;
        }

        /* Analysis Dashboard */
        .section-title {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            color: var(--purple-dark);
            padding: 18px 16px 12px;
            position: relative;
        }

        .section-title span {
            position: relative;
            z-index: 1;
            background: var(--bg-card);
            padding: 0 14px;
        }

        .section-title::after {
            content: '';
            position: absolute;
            left: 16px;
            right: 16px;
            top: 50%;
            height: 2px;
            background: var(--purple-light);
            z-index: 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 8px 16px 20px;
        }

        .stat-card {
            background: var(--bg-soft);
            border-radius: 12px;
            padding: 14px 12px;
            text-align: center;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 36px;
            height: 36px;
            background: rgba(155, 123, 184, 0.18);
            border-radius: 0 0 0 100%;
        }

        .stat-card .stat-label {
            font-size: 12px;
            color: var(--purple-mid);
            margin-bottom: 4px;
            font-weight: 500;
        }

        .stat-card .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--purple-dark);
        }

        .stat-card.status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-align: left;
            padding: 14px 16px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background: var(--success);
            border-radius: 50%;
            animation: ping 1.4s infinite;
        }

        /* Phone: Analysis cards height control only */
        @media (max-width: 768px) {
            .stats-grid {
                gap: 8px;
                padding: 6px 12px 14px;
            }
            .stat-card {
                padding: 8px 8px;
                min-height: 0;
            }
            .stat-card .stat-label {
                font-size: 11px;
                margin-bottom: 2px;
            }
            .stat-card .stat-value {
                font-size: 16px;
                line-height: 1.2;
            }
            .stat-card.status {
                padding: 8px 10px;
            }
            .stat-card.status .stat-value {
                font-size: 13px !important;
            }
            .stat-card::before {
                width: 24px;
                height: 24px;
            }
        }

        /* Prediction History */
        .history-wrap {
            padding: 0 14px 18px;
            max-height: 460px;
            overflow-y: auto;
        }

        .history-wrap::-webkit-scrollbar {
            width: 6px;
        }
        .history-wrap::-webkit-scrollbar-track {
            background: var(--bg-soft);
            border-radius: 4px;
        }
        .history-wrap::-webkit-scrollbar-thumb {
            background: var(--purple-light);
            border-radius: 4px;
        }

        .history-item {
            background: var(--bg-soft);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 10px;
            margin-bottom: 10px;
            display: grid;
            grid-template-columns: 1fr auto 42px;
            align-items: center;
            gap: 6px;
            overflow: visible;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .history-item:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 12px var(--shadow);
        }

        .history-left {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            overflow: visible;
        }

        .history-icon {
            width: 34px;
            height: 34px;
            min-width: 34px;
            background: rgba(155, 123, 184, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--purple-accent);
            font-size: 13px;
            flex-shrink: 0;
        }

        .history-period-label {
            font-size: 11px;
            color: var(--purple-mid);
        }

        .history-period-value {
            font-size: 11px;
            font-weight: 700;
            color: var(--purple-dark);
            white-space: nowrap;
            overflow: visible;
            letter-spacing: 0;
            font-variant-numeric: tabular-nums;
        }

        .history-right {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0;
            flex-shrink: 0;
        }

        .history-pred {
            text-align: center;
            flex-shrink: 0;
        }

        .history-pred-label {
            font-size: 11px;
            color: var(--purple-mid);
        }

        .history-pred-value {
            font-size: 14px;
            font-weight: 700;
            color: var(--purple-dark);
            white-space: nowrap;
        }

        .status-badge {
            width: 40px;
            height: 40px;
            min-width: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 18px;
            justify-self: end;
        }

        .status-badge.win {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .status-badge.loss {
            background: #ffebee;
            color: #c62828;
        }
        .status-badge.pending {
            background: #fff8e1;
            color: #f9a825;
        }

        /* Footer note */
        .engine-note {
            text-align: center;
            font-size: 11px;
            color: var(--purple-mid);
            opacity: 0.75;
            padding: 8px 16px 4px;
        }

        /* Animations */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        @keyframes ping {
            0% { transform: scale(1); opacity: 1; }
            75%, 100% { transform: scale(1.6); opacity: 0; }
        }

        /* Loading / Error */
        .loading-msg, .error-msg {
            text-align: center;
            padding: 20px;
            color: var(--purple-mid);
            font-size: 14px;
        }
        .error-msg {
            color: var(--danger);
        }
    </style>
</head>
<body>
    <div class="header">
        <svg viewBox="0 0 600 110">
            <defs>
                <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#4a2c6a"/>
                    <stop offset="50%" stop-color="#7b5ea7"/>
                    <stop offset="100%" stop-color="#9b7bb8"/>
                </linearGradient>
            </defs>
            <text x="50%" y="62%" text-anchor="middle" dominant-baseline="middle">MADARA 5.1</text>
        </svg>
        <div class="subtitle">BEAST PREDICTION ENGINE</div>
    </div>

    <div class="container">
        <!-- Current Period & Result -->
        <div class="card">
            <div class="current-box">
                <div class="current-item">
                    <div class="label">
                        <i class="fas fa-calendar-alt"></i>
                        <span>Period</span>
                    </div>
                    <div class="value" id="currentPeriod">----</div>
                </div>
                <div class="current-item right">
                    <div class="label">
                        <span>Result</span>
                        <i class="fas fa-poll"></i>
                    </div>
                    <div class="value" id="currentResult">----</div>
                </div>
            </div>
        </div>

        <!-- Analysis Dashboard -->
        <div class="card">
            <div class="section-title"><span>Analysis Dashboard</span></div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Most Frequent</div>
                    <div class="stat-value" id="mostFrequent">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Least Frequent</div>
                    <div class="stat-value" id="leastFrequent">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Win Rate</div>
                    <div class="stat-value" id="winRate">0%</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Wins</div>
                    <div class="stat-value" id="totalWins">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Losses</div>
                    <div class="stat-value" id="totalLosses">0</div>
                </div>
                <div class="stat-card status">
                    <div>
                        <div class="stat-label">Server Status</div>
                        <div class="stat-value" style="font-size:15px;" id="serverStatus">Connecting...</div>
                    </div>
                    <div class="status-dot" id="statusDot"></div>
                </div>
            </div>
        </div>

        <!-- Prediction History (Row Design - same as original) -->
        <div class="card">
            <div class="section-title"><span>Prediction History</span></div>
            
            <div class="history-wrap" id="historyContainer">
                <div class="loading-msg">Loading history...</div>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        // 🦍 BEAST CORE ENGINE v4.0  (HIDDEN — UI pe kuch show nahi hota)
        // ================================================================
        const BeastEngine = (() => {
            const CONFIG = {
                MAX_HISTORY: 200,
                API_SOURCES: [
                    'https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json',
                    'https://api.bdg88zf.com/api/webapi/GetGameIssue'
                ],
                ALGO_WEIGHTS: {
                    markov: 0.15, bayesian: 0.12, pattern: 0.12, gap: 0.09,
                    frequency: 0.10, streak: 0.10, regression: 0.09,
                    monteCarlo: 0.09, neural: 0.08, ensemble: 0.06
                }
            };
            let state = {
                history: [], algoPerformance: {}, winCount: 0, lossCount: 0,
                currentStreak: 0, totalPredictions: 0, lastUpdate: null
            };

            const Algorithms = {
                markov(history) {
                    if (history.length < 3) return null;
                    const matrix = Array(10).fill().map(() => Array(10).fill(0.01));
                    for (let i = 1; i < history.length; i++) {
                        const p = parseInt(history[i-1].number);
                        const c = parseInt(history[i].number);
                        if (!isNaN(p) && !isNaN(c)) matrix[p][c]++;
                    }
                    for (let i = 0; i < 10; i++) {
                        const sum = matrix[i].reduce((a,b) => a+b, 0);
                        if (sum > 0) for (let j = 0; j < 10; j++) matrix[i][j] /= sum;
                    }
                    const last = parseInt(history[0].number);
                    if (isNaN(last)) return null;
                    return matrix[last];
                },
                bayesian(history) {
                    if (history.length < 2) return null;
                    const probs = Array(10).fill(0.01);
                    const total = history.length;
                    history.forEach((h, idx) => {
                        const n = parseInt(h.number);
                        if (!isNaN(n)) {
                            const weight = 1 + (1 - idx / total) * 0.8;
                            probs[n] += weight / total;
                        }
                    });
                    const sum = probs.reduce((a,b) => a+b, 0);
                    return probs.map(p => p / sum);
                },
                pattern(history) {
                    if (history.length < 6) return null;
                    const nums = history.map(h => parseInt(h.number)).filter(n => !isNaN(n));
                    if (nums.length < 6) return null;
                    const probs = Array(10).fill(0.01);
                    for (let len = 2; len <= 5; len++) {
                        if (nums.length < len * 2) continue;
                        const pattern = nums.slice(0, len);
                        let matches = 0;
                        const counts = Array(10).fill(0);
                        for (let i = len; i < nums.length - 1; i++) {
                            let match = true;
                            for (let j = 0; j < len; j++) {
                                if (nums[i - len + j] !== pattern[j]) { match = false; break; }
                            }
                            if (match) {
                                const next = nums[i + 1];
                                if (!isNaN(next)) { counts[next]++; matches++; }
                            }
                        }
                        if (matches > 0) {
                            for (let i = 0; i < 10; i++) probs[i] += (counts[i] / matches) * 0.35;
                        }
                    }
                    const sum = probs.reduce((a,b) => a+b, 0);
                    return probs.map(p => p / sum);
                },
                gap(history) {
                    if (history.length < 5) return null;
                    const nums = history.map(h => parseInt(h.number)).filter(n => !isNaN(n));
                    const lastSeen = Array(10).fill(0);
                    nums.forEach((n, i) => lastSeen[n] = i);
                    const maxGap = nums.length;
                    const probs = lastSeen.map(gap => 0.01 + ((maxGap - gap) / maxGap) * 0.7);
                    const sum = probs.reduce((a,b) => a+b, 0);
                    return probs.map(p => p / sum);
                },
                frequency(history) {
                    if (history.length < 3) return null;
                    const counts = Array(10).fill(0);
                    history.forEach(h => {
                        const n = parseInt(h.number);
                        if (!isNaN(n)) counts[n]++;
                    });
                    const total = history.length;
                    const probs = counts.map(c => (c + 0.5) / (total + 5));
                    const sum = probs.reduce((a,b) => a+b, 0);
                    return probs.map(p => p / sum);
                },
                streak(history) {
                    if (history.length < 3) return null;
                    const nums = history.map(h => parseInt(h.number)).filter(n => !isNaN(n));
                    let streak = 1;
                    for (let i = 1; i < nums.length; i++) {
                        if (nums[i] === nums[i-1]) streak++;
                        else break;
                    }
                    const probs = Array(10).fill(0.01);
                    if (streak >= 2) {
                        for (let i = 0; i < 10; i++) {
                            if (i !== nums[0]) probs[i] += 0.12 * streak;
                        }
                    }
                    nums.slice(0, 5).forEach((n, idx) => { probs[n] += 0.06 * (5 - idx); });
                    const sum = probs.reduce((a,b) => a+b, 0);
                    return probs.map(p => p / sum);
                },
                regression(history) {
                    if (history.length < 6) return null;
                    const nums = history.map(h => parseInt(h.number)).filter(n => !isNaN(n));
                    const n = nums.length;
                    const sumX = nums.reduce((a, _, i) => a + i, 0);
                    const sumY = nums.reduce((a, b) => a + b, 0);
                    const sumXY = nums.reduce((a, b, i) => a + (b * i), 0);
                    const sumX2 = nums.reduce((a, _, i) => a + (i * i), 0);
                    const slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
                    const intercept = (sumY - slope * sumX) / n;
                    const next = Math.round(slope * n + intercept);
                    const clamped = Math.max(0, Math.min(9, next));
                    const probs = Array(10).fill(0.01);
                    probs[clamped] += 0.35;
                    for (let d = -2; d <= 2; d++) {
                        const idx = clamped + d;
                        if (idx >= 0 && idx < 10) probs[idx] += 0.06 * (3 - Math.abs(d));
                    }
                    const sum = probs.reduce((a,b) => a+b, 0);
                    return probs.map(p => p / sum);
                },
                monteCarlo(history) {
                    if (history.length < 10) return null;
                    const nums = history.map(h => parseInt(h.number)).filter(n => !isNaN(n));
                    const probs = Array(10).fill(0);
                    for (let iter = 0; iter < 2000; iter++) {
                        const sample = [];
                        for (let i = 0; i < 5; i++) sample.push(nums[Math.floor(Math.random() * nums.length)]);
                        const counts = Array(10).fill(0);
                        sample.forEach(n => counts[n]++);
                        let maxCount = 0, maxNum = 0;
                        counts.forEach((c, i) => { if (c > maxCount) { maxCount = c; maxNum = i; } });
                        probs[maxNum]++;
                    }
                    const sum = probs.reduce((a,b) => a+b, 0);
                    return probs.map(p => p / sum);
                },
                neural(history) {
                    if (history.length < 8) return null;
                    const nums = history.map(h => parseInt(h.number)).filter(n => !isNaN(n));
                    const probs = Array(10).fill(0.01);
                    const layers = [
                        { weights: [0.3, 0.2, 0.15, 0.1, 0.05], offset: 0 },
                        { weights: [0.25, 0.2, 0.15, 0.1, 0.05, 0.025], offset: 2 }
                    ];
                    layers.forEach(layer => {
                        const pattern = nums.slice(0, layer.weights.length);
                        for (let i = layer.offset; i < nums.length - 1; i++) {
                            let match = true;
                            for (let j = 0; j < pattern.length; j++) {
                                if (i - j < 0 || nums[i - j] !== pattern[j]) { match = false; break; }
                            }
                            if (match) {
                                const next = nums[i + 1];
                                if (!isNaN(next)) {
                                    probs[next] += layer.weights.reduce((a, w, idx) => a + w * pattern[idx], 0) / pattern.length;
                                }
                            }
                        }
                    });
                    const sum = probs.reduce((a,b) => a+b, 0);
                    return probs.map(p => p / sum);
                },
                ensemble(history) {
                    if (history.length < 5) return null;
                    const results = [];
                    ['markov', 'bayesian', 'pattern', 'frequency', 'streak'].forEach(name => {
                        try {
                            const result = Algorithms[name](history);
                            if (result) results.push({ name, result });
                        } catch (e) {}
                    });
                    if (results.length === 0) return null;
                    const combined = Array(10).fill(0);
                    results.forEach(r => r.result.forEach((p, i) => combined[i] += p / results.length));
                    const sum = combined.reduce((a,b) => a+b, 0);
                    return combined.map(p => p / sum);
                }
            };

            function predict(history) {
                if (!history || history.length === 0) {
                    return { number: Math.floor(Math.random() * 10), confidence: 15, algorithm: 'random' };
                }
                const results = [];
                const weights = { ...CONFIG.ALGO_WEIGHTS };
                Object.keys(weights).forEach(key => {
                    const perf = state.algoPerformance[key] || { score: 0.5, count: 0 };
                    if (perf.count > 3) weights[key] = weights[key] * (0.5 + perf.score * 0.6);
                });
                let totalWeight = 0;
                Object.values(weights).forEach(w => totalWeight += w);
                Object.entries(Algorithms).forEach(([name, fn]) => {
                    try {
                        const result = fn(history);
                        if (result && result.length === 10) {
                            const weight = (weights[name] || 0.08) / totalWeight;
                            results.push({ name, probabilities: result, weight });
                        }
                    } catch (e) {}
                });
                if (results.length === 0) {
                    return { number: Math.floor(Math.random() * 10), confidence: 15, algorithm: 'fallback' };
                }
                const combined = Array(10).fill(0);
                results.forEach(r => r.probabilities.forEach((p, i) => { combined[i] += p * r.weight; }));
                const sum = combined.reduce((a, b) => a + b, 0);
                combined.forEach((p, i) => combined[i] = p / sum);
                let best = 0, bestProb = 0;
                combined.forEach((p, i) => { if (p > bestProb) { bestProb = p; best = i; } });
                const sorted = [...combined].sort((a, b) => b - a);
                const spread = sorted[0] - sorted[1];
                const confidence = Math.min(98, Math.max(15, 30 + spread * 90));
                let primaryAlgo = 'ensemble';
                let maxContribution = 0;
                results.forEach(r => {
                    const contrib = r.probabilities[best] * r.weight;
                    if (contrib > maxContribution) { maxContribution = contrib; primaryAlgo = r.name; }
                });
                return { number: best, confidence: Math.round(confidence), algorithm: primaryAlgo, probabilities: combined };
            }

            function predictBigSmall(history, predictedNum) {
                // Primary signal = predicted number from full algo bank
                let bigScore = 0;
                let smallScore = 0;

                // 1) Number prediction weight (strongest)
                if (predictedNum >= 5) bigScore += 40;
                else smallScore += 40;

                // 2) Recent frequency (last 20)
                const recent = history.slice(0, 20);
                let big = 0, small = 0;
                recent.forEach(h => {
                    const n = parseInt(h.number);
                    if (isNaN(n)) return;
                    if (n >= 5) big++; else small++;
                });
                const total = big + small;
                if (total > 0) {
                    // slight mean-reversion: if too many Big recently, lean Small
                    bigScore += (small / total) * 25;
                    smallScore += (big / total) * 25;
                }

                // 3) Streak break
                let streak = 1, streakType = null;
                for (let i = 1; i < Math.min(12, history.length); i++) {
                    const prev = parseInt(history[i - 1].number);
                    const curr = parseInt(history[i].number);
                    if (isNaN(prev) || isNaN(curr)) break;
                    const pt = prev >= 5 ? 'Big' : 'Small';
                    const ct = curr >= 5 ? 'Big' : 'Small';
                    if (i === 1) streakType = pt;
                    if (pt === ct && pt === streakType) streak++;
                    else break;
                }
                if (streak >= 2 && streakType) {
                    // after streak, lean opposite
                    if (streakType === 'Big') smallScore += 10 + streak * 3;
                    else bigScore += 10 + streak * 3;
                }

                // 4) Last result opposite lean (mild)
                if (history.length > 0) {
                    const last = parseInt(history[0].number);
                    if (!isNaN(last)) {
                        if (last >= 5) smallScore += 8;
                        else bigScore += 8;
                    }
                }

                // 5) Period-based salt so not stuck same side
                if (history.length > 0 && history[0].issueNumber) {
                    const salt = parseInt(String(history[0].issueNumber).slice(-3)) || 0;
                    if (salt % 2 === 0) bigScore += 5;
                    else smallScore += 5;
                }

                const type = bigScore >= smallScore ? 'Big' : 'Small';
                const sum = bigScore + smallScore || 1;
                const prob = Math.round((Math.max(bigScore, smallScore) / sum) * 100);
                return { type, prob };
            }

            function numberToColor(n) {
                // Fixed: 0 = RED, 5 = GREEN
                if (n === 0) return 'RED';
                if (n === 5) return 'GREEN';
                if ([1, 3, 7, 9].includes(n)) return 'RED';
                if ([2, 4, 6, 8].includes(n)) return 'GREEN';
                return 'GREEN';
            }

            async function fetchGameResult() {
                try {
                    const res = await fetch(CONFIG.API_SOURCES[0] + '?ts=' + Date.now());
                    const data = await res.json();
                    if (data?.data?.list && data.data.list.length > 0) {
                        return data.data.list.slice(0, 25);
                    }
                } catch (e) {}
                try {
                    const res = await fetch(CONFIG.API_SOURCES[1], {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            typeId: 1, language: 0,
                            random: '40079dcba93a48769c6ee9d4d4fae23f',
                            signature: 'D12108C4F57C549D82B23A91E0FA20AE',
                            timestamp: Math.floor(Date.now() / 1000)
                        })
                    });
                    const data = await res.json();
                    if (data?.data?.issueNumber) {
                        const mock = [];
                        const base = Number(data.data.issueNumber);
                        for (let i = 0; i < 15; i++) {
                            mock.push({ issueNumber: String(base - i), number: String(Math.floor(Math.random() * 10)) });
                        }
                        return mock;
                    }
                } catch (e) {}
                const mock = [];
                const base = Math.floor(Date.now() / 60000); // changes every minute
                for (let i = 0; i < 20; i++) {
                    // deterministic pseudo-random from issue so calculation can work
                    const iss = base - i;
                    const num = Math.abs((iss * 9301 + 49297) % 10);
                    mock.push({ issueNumber: String(iss), number: String(num) });
                }
                return mock;
            }

            return {
                getState() { return { ...state }; },
                getHistory() { return [...state.history]; },
                addData(entries) {
                    entries.forEach(item => {
                        const iss = item.issueNumber || item.issue || item.period || item.IssueNumber || item.Issue;
                        let num = item.number ?? item.Number ?? item.result ?? item.Result ?? item.openNumber ?? item.openNum;
                        if (iss === undefined || iss === null || num === undefined || num === null) return;
                        num = parseInt(num);
                        if (isNaN(num)) return;
                        const exists = state.history.some(h => String(h.issue) === String(iss));
                        if (!exists) {
                            state.history.unshift({
                                issue: String(iss),
                                actual: num,
                                predicted: null, result: 'pending', algo: null, confidence: null
                            });
                        } else {
                            // update actual if was missing
                            const row = state.history.find(h => String(h.issue) === String(iss));
                            if (row && (row.actual === undefined || row.actual === null)) row.actual = num;
                        }
                    });
                    // keep newest first, sort by issue if possible
                    state.history.sort((a, b) => {
                        try { return BigInt(b.issue) > BigInt(a.issue) ? 1 : -1; } catch(e) {
                            return String(b.issue).localeCompare(String(a.issue));
                        }
                    });
                    if (state.history.length > CONFIG.MAX_HISTORY) state.history = state.history.slice(0, CONFIG.MAX_HISTORY);
                    state.lastUpdate = new Date();
                },
                processPending() {
                    const pending = state.history.filter(h => h.result === 'pending' && h.actual !== undefined && h.predicted !== null);
                    pending.forEach(p => {
                        const isWin = p.predicted === p.actual;
                        p.result = isWin ? 'win' : 'loss';
                        if (isWin) { state.winCount++; state.currentStreak++; }
                        else { state.lossCount++; state.currentStreak = 0; }
                        state.totalPredictions++;
                        if (p.algo) {
                            if (!state.algoPerformance[p.algo]) state.algoPerformance[p.algo] = { score: 0.5, count: 0 };
                            const perf = state.algoPerformance[p.algo];
                            perf.score = (perf.score * perf.count + (isWin ? 1 : 0)) / (perf.count + 1);
                            perf.count++;
                        }
                    });
                    return pending.length;
                },
                predictNext() {
                    const historyData = state.history
                        .filter(h => h.actual !== undefined && h.actual !== null && !isNaN(h.actual))
                        .map(h => ({ number: Number(h.actual), issueNumber: h.issue }));
                    const prediction = predict(historyData);
                    // Force number 0-9
                    prediction.number = ((prediction.number % 10) + 10) % 10;
                    const bigSmall = predictBigSmall(historyData, prediction.number);
                    const color = numberToColor(prediction.number);
                    let nextIssue = '-----';
                    if (state.history.length > 0 && state.history[0].issue) {
                        try { nextIssue = String(BigInt(state.history[0].issue) + 1n); } catch (e) {
                            try { nextIssue = String(Number(state.history[0].issue) + 1); } catch (e2) {}
                        }
                    }
                    state.history.unshift({
                        issue: nextIssue, predicted: prediction.number, actual: undefined,
                        result: 'pending', algo: prediction.algorithm, confidence: prediction.confidence
                    });
                    if (state.history.length > CONFIG.MAX_HISTORY) state.history = state.history.slice(0, CONFIG.MAX_HISTORY);
                    return {
                        issue: nextIssue,
                        number: prediction.number,
                        color: color,
                        bigSmall: bigSmall.type,
                        confidence: prediction.confidence
                    };
                },
                async fetchData() {
                    const data = await fetchGameResult();
                    if (data && data.length > 0) {
                        this.addData(data);
                        this.processPending();
                    }
                    return data;
                },
                getAnalytics() {
                    const nums = state.history.filter(h => h.actual !== undefined).map(h => parseInt(h.actual)).filter(n => !isNaN(n));
                    if (nums.length === 0) return null;
                    const counts = Array(10).fill(0);
                    nums.forEach(n => counts[n]++);
                    const maxFreq = Math.max(...counts);
                    const hot = counts.map((c, i) => ({ n: i, c })).filter(x => x.c === maxFreq).map(x => x.n);
                    const minFreq = Math.min(...counts.filter(c => c > 0));
                    const cold = counts.map((c, i) => ({ n: i, c })).filter(x => x.c === minFreq).map(x => x.n);
                    return {
                        total: nums.length,
                        counts, hotNumbers: hot, coldNumbers: cold,
                        winRate: state.winCount + state.lossCount > 0 ? Math.round((state.winCount / (state.winCount + state.lossCount)) * 100) : 0,
                        winCount: state.winCount, lossCount: state.lossCount, currentStreak: state.currentStreak
                    };
                }
            };
        })();
        window.BeastEngine = BeastEngine;

        // ================================================================
        // UI LAYER — sirf Color + Big/Small dikhega, calculation hide
        // ================================================================
        const POLL_INTERVAL = 5000;
        const MAX_UI_HISTORY = 25;
        let uiHistory = [];
        let lastFetchedIssue = null;
        let isFirstLoad = true;

        function extractList(data) {
            if (!data) return [];
            if (Array.isArray(data)) return data;
            if (data.data && Array.isArray(data.data.list)) return data.data.list;
            if (data.data && Array.isArray(data.data)) return data.data;
            if (data.list && Array.isArray(data.list)) return data.list;
            return [];
        }

        function getIssue(item) {
            return item.issueNumber || item.issue || item.period || item.IssueNumber || item.Issue || "";
        }
        function getNumber(item) {
            const n = item.number ?? item.Number ?? item.result ?? item.Result ?? item.openNumber;
            return n !== undefined && n !== null ? Number(n) : null;
        }

        async function updateDashboard() {
            let list = [];
            try {
                const data = await BeastEngine.fetchData();
                list = extractList(data) || (Array.isArray(data) ? data : []);
            } catch (e) {
                document.getElementById("serverStatus").textContent = "Offline";
                document.getElementById("statusDot").style.background = "#c62828";
            }

            if (!list || list.length === 0) {
                if (isFirstLoad) {
                    document.getElementById("historyContainer").innerHTML =
                        `<div class="error-msg">API se data nahi mil raha.<br>Engine ready hai.</div>`;
                    document.getElementById("serverStatus").textContent = "Offline / Blocked";
                    document.getElementById("statusDot").style.background = "#c62828";
                }
                isFirstLoad = false;
                return;
            }

            document.getElementById("serverStatus").textContent = "Connected";
            document.getElementById("statusDot").style.background = "#2e7d32";

            const latest = list[0];
            const issue = getIssue(latest);
            const number = getNumber(latest);
            if (!issue || issue === lastFetchedIssue) return;

            // Resolve ALL pending rows whose period already finished
            // 0 = RED, 5 = GREEN (fixed rule)
            function getActualColor(n) {
                if (n === 0) return "RED";
                if (n === 5) return "GREEN";
                if ([1, 3, 7, 9].includes(n)) return "RED";
                if ([2, 4, 6, 8].includes(n)) return "GREEN";
                return "GREEN";
            }
            function getActualSize(n) {
                return n >= 5 ? "BIG" : "SMALL";
            }

            // Map latest API results by issue for pending resolve
            const resultMap = {};
            list.forEach(it => {
                const iss = getIssue(it);
                const num = getNumber(it);
                if (iss && num !== null) resultMap[String(iss)] = num;
            });

            uiHistory.forEach(row => {
                if (row.status !== "Pending") return;
                const key = String(row.period);
                // also try without leading zeros mismatch
                let actual = resultMap[key];
                if (actual === undefined) {
                    // match by last digits
                    const found = Object.keys(resultMap).find(k => k.endsWith(key.slice(-5)) || key.endsWith(k.slice(-5)));
                    if (found) actual = resultMap[found];
                }
                if (actual === undefined || actual === null) return;

                const pred = (row.prediction || "").trim().toUpperCase();
                const actualColor = getActualColor(actual);
                const actualSize = getActualSize(actual);
                let isWin = false;
                if (pred === "RED" || pred === "GREEN") {
                    isWin = pred === actualColor;
                } else if (pred === "BIG" || pred === "SMALL") {
                    isWin = pred === actualSize;
                }
                row.result = actual;
                row.status = isWin ? "WIN" : "LOSS";
            });

            // Current open period = latest completed + 1
            let currentIssue = issue;
            try { currentIssue = String(BigInt(issue) + 1n); }
            catch (e) { currentIssue = String(Number(issue) + 1); }

            // Skip if we already predicted this current period
            if (uiHistory.length > 0 && String(uiHistory[0].period) === String(currentIssue) && uiHistory[0].status === "Pending") {
                lastFetchedIssue = issue;
                renderHistory();
                updateStats();
                isFirstLoad = false;
                return;
            }

            // Beast prediction for CURRENT period only
            const pred = BeastEngine.predictNext();
            // Force prediction issue = current period
            pred.issue = currentIssue;

            // Prediction ONLY Big / Small
            let displayPred = pred.bigSmall.toUpperCase();

            // ---- LOSS-PATTERN ADAPTIVE FLIP ----
            // Agar recent history mein continuous / dense losses hain → prediction ULTA
            // Agar mostly wins + isolated losses → normal engine calculation
            (function applyLossPatternFlip() {
                const settled = uiHistory.filter(h => h.status === "WIN" || h.status === "LOSS");
                if (settled.length < 2) return;

                const recent = settled.slice(0, 8);
                const losses = recent.filter(h => h.status === "LOSS").length;
                const wins = recent.filter(h => h.status === "WIN").length;

                let consecLoss = 0;
                for (let i = 0; i < settled.length; i++) {
                    if (settled[i].status === "LOSS") consecLoss++;
                    else break;
                }

                let lossPairs = 0;
                for (let i = 0; i < recent.length - 1; i++) {
                    if (recent[i].status === "LOSS" && recent[i + 1].status === "LOSS") lossPairs++;
                }

                const unstable = (consecLoss >= 2) || (lossPairs >= 2) || (losses >= wins && losses >= 3);

                if (unstable) {
                    displayPred = (displayPred === "BIG") ? "SMALL" : "BIG";
                }
            })();


            // Card pe last 4 digits, history mein pura period
            const shortPeriod = String(currentIssue).slice(-4);

            lastFetchedIssue = issue;

            document.getElementById("currentPeriod").textContent = shortPeriod;
            document.getElementById("currentResult").textContent = displayPred;

            uiHistory.unshift({
                period: currentIssue,
                shortPeriod: shortPeriod,
                prediction: displayPred,
                result: "-",
                status: "Pending"
            });
            if (uiHistory.length > MAX_UI_HISTORY) uiHistory.pop();

            renderHistory();
            updateStats();
            isFirstLoad = false;
        }

        function renderHistory() {
            const container = document.getElementById("historyContainer");
            if (uiHistory.length === 0) {
                container.innerHTML = `<div class="loading-msg">Waiting for first prediction...</div>`;
                return;
            }
            container.innerHTML = uiHistory.map(item => {
                let badgeClass = "pending";
                let icon = "fa-clock";
                if (item.status === "WIN") { badgeClass = "win"; icon = "fa-check-circle"; }
                else if (item.status === "LOSS") { badgeClass = "loss"; icon = "fa-times-circle"; }

                return `
                <div class="history-item">
                    <div class="history-left">
                        <div class="history-icon"><i class="fas fa-calendar-alt"></i></div>
                        <div style="min-width:0;">
                            <div class="history-period-label">Period</div>
                            <div class="history-period-value">${item.period}</div>
                        </div>
                    </div>
                    <div class="history-pred">
                        <div class="history-pred-label">Prediction</div>
                        <div class="history-pred-value">${item.prediction}</div>
                    </div>
                    <div class="status-badge ${badgeClass}">
                        <i class="fas ${icon}"></i>
                    </div>
                </div>`;
            }).join("");
        }

        function updateStats() {
            const wins = uiHistory.filter(h => h.status === "WIN").length;
            const losses = uiHistory.filter(h => h.status === "LOSS").length;
            const total = wins + losses;
            const rate = total > 0 ? ((wins / total) * 100).toFixed(1) : "0.0";
            document.getElementById("totalWins").textContent = wins;
            document.getElementById("totalLosses").textContent = losses;
            document.getElementById("winRate").textContent = rate + "%";

            const freq = {};
            uiHistory.forEach(h => { if (h.prediction) freq[h.prediction] = (freq[h.prediction] || 0) + 1; });
            const sorted = Object.entries(freq).sort((a, b) => b[1] - a[1]);
            document.getElementById("mostFrequent").textContent = sorted[0] ? sorted[0][0] : "-";
            document.getElementById("leastFrequent").textContent = sorted.length > 1 ? sorted[sorted.length - 1][0] : "-";
        }

        document.addEventListener("DOMContentLoaded", () => {
            updateDashboard();
            setInterval(updateDashboard, POLL_INTERVAL);
        });
    </script>
</body>
