<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Mobile screens ke liye responsive viewport settings -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Page</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body { 
      margin: 0; 
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f4f4f9;
      color: #333;
    }
    
    /* Responsive Wrapper Container */
    #content { 
      width: 100%;
      max-width: 1200px; /* Desktop layout boundaries */
      margin: 0 auto;
      padding: 16px;
    }

    /* Mobile First Styling Adjustments */
    @media (min-width: 768px) {
      #content {
        padding: 32px;
      }
    }
  </style>
</head>
<body>
  <main id="content">Loading...</main>

  <script>
    fetch('/api/content')
      .then(res => res.text())
      .then(html => {
        // Document rewrite karne ke bajaye safe DOM insertion
        const contentDiv = document.getElementById('content');
        contentDiv.innerHTML = html;
      })
      .catch(() => {
        document.getElementById('content').innerHTML = '<p style="color:red;">Failed to load content.</p>';
      });
  </script>
</body>
</html>
