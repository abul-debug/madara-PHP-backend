<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Page</title>
</head>
<body>
  <div id="loading">Loading...</div>

  <script>
    fetch('/api/content')
      .then(res => res.text())
      .then(html => {
        document.open();
        document.write(html);
        document.close();
      })
      .catch(err => {
        document.getElementById('loading').innerText = 'Failed to load content';
        console.error(err);
      });
  </script>
</body>
</html>
